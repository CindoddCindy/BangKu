server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: bangku-transaction-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bangku_db}
    username: ${SPRING_DATASOURCE_USERNAME:bangku}
    password: ${SPRING_DATASOURCE_PASSWORD:bangku_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: bangku
    password: bangku_secret

account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.bangku: DEBUG
